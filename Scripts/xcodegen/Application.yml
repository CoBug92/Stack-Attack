targets:
  ${TARGET_NAME}:
    type: application
    platform: iOS
    sources:
      - path: ../../StackAttack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: ${TARGET_NAME}
        DEVELOPMENT_TEAM: ${TEAM_ID}
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: ${APP_DISPLAY_NAME}
        INFOPLIST_KEY_CFBundleShortVersionString: 1.0.0
        INFOPLIST_KEY_CFBundleVersion: 1
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        EXTRACT_APP_INTENTS_METADATA: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: true
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: match AppStore ${BUNDLE_ID}
          CODE_SIGN_IDENTITY: "Apple Distribution"
    scheme:
      testTargets:
        - ${TARGET_NAME}UnitTests
    postCompileScripts:
      - script: ./Scripts/swiftlint/swiftlint.sh
        name: Run SwiftLint
        basedOnDependencyAnalysis: false
  ${TARGET_NAME}UnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../UnitTests
    dependencies:
      - target: ${TARGET_NAME}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}Tests
        GENERATE_INFOPLIST_FILE: true
