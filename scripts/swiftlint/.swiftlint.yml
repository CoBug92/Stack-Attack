included:
  - ../../StackAttack

excluded:
  - ../../.DerivedData

only_rules:
  - closure_spacing
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - force_cast
  - force_try
  - force_unwrapping
  - implicit_getter
  - leading_whitespace
  - line_length
  - mark
  - opening_brace
  - operator_usage_whitespace
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - shorthand_operator
  - sorted_imports
  - statement_position
  - syntactic_sugar
  - trailing_newline
  - trailing_whitespace
  - vertical_whitespace

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

reporter: xcode
